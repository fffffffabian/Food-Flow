<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Flow — Menú</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Google Fonts: Poppins (headings) + Open Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ff-primary: #A44A3F;   /* terracota */
      --ff-accent:  #E4B363;   /* ámbar */
      --ff-bg:      #FAF3EA;   /* crema */
      --ff-ink:     #3a2b26;
    }
    body {
      background: var(--ff-bg);
      color: var(--ff-ink);
      font-family: "Open Sans", system-ui, sans-serif;
    }
    h1, h2, h3, h4, h5, .navbar-brand, .card-title {
      font-family: "Poppins", system-ui, sans-serif;
    }
    .ff-navbar { background: var(--ff-primary); }
    .ff-navbar .navbar-brand { color: #fff; font-weight: 700; letter-spacing: .3px; }
    .ff-navbar .navbar-text { color: #fff; }

    .ff-store-head h1 { color: var(--ff-primary); font-weight: 700; }
    .ff-store-head .ff-meta { color: #6b5750; }

    .ff-card {
      border: none;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(110, 70, 55, .10);
      transition: transform .15s ease, box-shadow .15s ease;
      height: 100%;
    }
    .ff-card:hover { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(110, 70, 55, .16); }
    .ff-thumb {
      height: 120px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      background: linear-gradient(135deg, #f6e2c4, var(--ff-accent));
    }
    .ff-badge {
      background: rgba(164, 74, 63, .10);
      color: var(--ff-primary);
      font-weight: 600;
    }
    .ff-price { color: var(--ff-primary); font-weight: 700; font-size: 1.15rem; }
    .ff-btn {
      background: var(--ff-accent);
      color: var(--ff-ink);
      font-weight: 600;
      border: none;
    }
    .ff-btn:hover { background: #d8a24f; color: var(--ff-ink); }
    .ff-cartbtn { background: #fff; color: var(--ff-primary); font-weight: 600; border: none; }
    .ff-cartbtn:hover { background: #f3e7d7; color: var(--ff-primary); }
    .ff-cartbtn .badge { background: var(--ff-accent); color: var(--ff-ink); }
    .ff-meta { color: #6b5750; font-size: .92rem; }
    footer { color: #8a756c; }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <nav class="navbar ff-navbar shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1"><img src="assets/img/logo.svg" alt="" style="height:26px;vertical-align:-5px" class="me-1">Food Flow</span>
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text d-none d-sm-inline">Pide a domicilio, sin llamar</span>
        <a class="btn ff-cartbtn" href="cart.html">
          <i class="bi bi-cart3"></i> Carrito <span id="ff-cart-count" class="badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="container pt-4">
    <img src="assets/img/hero.svg" alt="Comida a domicilio con Food Flow" class="img-fluid rounded-4 w-100">
  </div>

  <!-- Encabezado de la tienda -->
  <header class="ff-store-head container pt-4 pb-2">
    <div id="cabecera"></div>
  </header>

  <!-- Menú (productos) -->
  <main class="container pb-5">
    <div id="productos" class="row g-4"></div>

    <!-- Estado vacío / error -->
    <div id="estado" class="text-center py-5 d-none">
      <div style="font-size:3rem">🍽️</div>
      <p id="estado-msg" class="lead mt-2 mb-0"></p>
    </div>
  </main>

  <footer class="text-center py-4">
    <small>Food Flow · pedidos a domicilio para PyMEs</small>
  </footer>

  <script>
    // Esta es la tienda cuyo menú se muestra al abrir Food Flow.
    const STORE_ID = 1; // Mr Sushi

    const ICONO_PROD = {
      "Rollos": "🍣", "Especialidades": "🍤"
    };

    function mostrarEstado(mensaje) {
      document.getElementById("productos").classList.add("d-none");
      document.getElementById("estado-msg").textContent = mensaje;
      document.getElementById("estado").classList.remove("d-none");
    }

    Promise.all([
      fetch("data/businesses.json").then(function (r) { return r.json(); }),
      fetch("data/products.json").then(function (r) { return r.json(); })
    ])
    .then(function (datos) {
      const tiendas = datos[0];
      const productos = datos[1];

      const tienda = tiendas.find(function (t) { return t.id === STORE_ID; });
      if (tienda) {
        document.title = "Food Flow — " + tienda.name;
        document.getElementById("cabecera").innerHTML =
          '<span class="badge ff-badge mb-2">' + tienda.category + '</span>' +
          '<h1 class="mb-1">' + tienda.name + '</h1>' +
          '<p class="ff-meta mb-0"><i class="bi bi-geo-alt"></i> ' + tienda.delivery_zone + ' · <i class="bi bi-scooter"></i> Envío: Q' + tienda.shipping_cost + '</p>';
      }

      const menu = productos.filter(function (p) { return p.business_id === STORE_ID; });
      if (menu.length === 0) {
        mostrarEstado("Este menú todavía no tiene productos.");
        return;
      }

      const cont = document.getElementById("productos");
      menu.forEach(function (p) {
        const col = document.createElement("div");
        col.className = "col-12 col-sm-6 col-lg-4";
        col.innerHTML =
          '<article class="card ff-card">' +
            '<div class="ff-thumb">' + (ICONO_PROD[p.category] || "🍽️") + '</div>' +
            '<div class="card-body d-flex flex-column">' +
              '<span class="badge ff-badge align-self-start mb-2">' + p.category + '</span>' +
              '<h5 class="card-title mb-1">' + p.name + '</h5>' +
              '<p class="ff-meta mb-2">' + p.description + '</p>' +
              '<p class="ff-price mb-3">Q' + p.price + '</p>' +
              '<a class="btn ff-btn mt-auto" href="product.html?id=' + p.id + '">Ver detalle</a>' +
            '</div>' +
          '</article>';
        cont.appendChild(col);
      });
    })
    .catch(function () {
      mostrarEstado("Este menú todavía no tiene productos.");
    });
  </script>

  <!-- Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica del carrito -->
  <script src="cart.js"></script>
  <!-- Asistente (chatbot) -->
  <script src="chat.js"></script>
</body>
</html>
