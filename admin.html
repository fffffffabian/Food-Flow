<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Flow — Operador</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --ff-primary:#A44A3F; --ff-accent:#E4B363; --ff-bg:#FAF3EA; --ff-ink:#3a2b26; }
    body { background: var(--ff-bg); color: var(--ff-ink); font-family: "Open Sans", system-ui, sans-serif; }
    h1, .navbar-brand { font-family: "Poppins", system-ui, sans-serif; }
    .ff-navbar { background: var(--ff-primary); }
    .ff-navbar .navbar-brand { color:#fff; font-weight:700; }
    .ff-title { color: var(--ff-primary); font-weight: 700; }
    .card { border:none; border-radius:16px; box-shadow:0 6px 18px rgba(110,70,55,.10); }
    .table td, .table th { vertical-align: middle; font-size: .9rem; }
    .badge-estado { font-weight:600; }
    footer { color:#8a756c; }
  </style>
</head>
<body>
  <nav class="navbar ff-navbar shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1"><i class="bi bi-clipboard-check"></i> Food Flow · Operador</span>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="ff-title mb-1">Pedidos</h1>
    <p class="text-muted">Panel interno para gestionar y actualizar el estado de los pedidos.</p>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Folio</th><th>Cliente</th><th>Teléfono</th><th>Dirección</th>
                <th>Pedido</th><th>Total</th><th>Estado</th>
              </tr>
            </thead>
            <tbody id="filas">
              <tr><td colspan="7" class="text-center text-muted py-4">Cargando pedidos…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4"><small>Food Flow · panel de operador</small></footer>

  <script>
    const ESTADOS = ["Recibido", "En preparación", "En camino", "Entregado", "Cancelado"];

    function opciones(actual) {
      return ESTADOS.map(function (e) {
        return '<option' + (e === actual ? ' selected' : '') + '>' + e + '</option>';
      }).join("");
    }

    fetch("/api/admin")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        const tbody = document.getElementById("filas");
        const pedidos = data.pedidos || [];
        if (pedidos.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Aún no hay pedidos.</td></tr>';
          return;
        }
        tbody.innerHTML = "";
        pedidos.forEach(function (p) {
          const tr = document.createElement("tr");
          tr.innerHTML =
            '<td class="fw-semibold">' + (p.folio || "—") + '</td>' +
            '<td>' + (p.nombre || "") + '</td>' +
            '<td>' + (p.telefono || "") + '</td>' +
            '<td>' + (p.direccion || "") + '</td>' +
            '<td>' + (p.pedido || "") + '</td>' +
            '<td>Q' + (p.total || "") + '</td>' +
            '<td><select class="form-select form-select-sm ff-estado" data-id="' + p.id + '">' + opciones(p.estado) + '</select>' +
            '<span class="text-success small ms-1 ff-ok" style="display:none">✓</span></td>';
          tbody.appendChild(tr);
        });
      })
      .catch(function () {
        document.getElementById("filas").innerHTML =
          '<tr><td colspan="7" class="text-center text-danger py-4">No se pudieron cargar los pedidos.</td></tr>';
      });

    // Cambiar estado al elegir en el select
    document.addEventListener("change", async function (e) {
      const sel = e.target.closest(".ff-estado");
      if (!sel) { return; }
      const ok = sel.parentElement.querySelector(".ff-ok");
      const r = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: Number(sel.dataset.id), estado: sel.value })
      });
      if (r.ok && ok) {
        ok.style.display = "inline";
        setTimeout(function () { ok.style.display = "none"; }, 1500);
      }
    });
  </script>
</body>
</html>
