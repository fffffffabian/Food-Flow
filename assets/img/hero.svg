<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Comida a domicilio con Food Flow">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E2C4"/>
      <stop offset="1" stop-color="#E4B363"/>
    </linearGradient>
  </defs>
  <rect width="960" height="280" rx="24" fill="url(#g)"/>

  <!-- circulos decorativos -->
  <circle cx="835" cy="55" r="95" fill="#A44A3F" opacity="0.10"/>
  <circle cx="905" cy="225" r="55" fill="#A44A3F" opacity="0.08"/>
  <circle cx="110" cy="235" r="70" fill="#ffffff" opacity="0.22"/>
  <circle cx="180" cy="85" r="16" fill="#A44A3F" opacity="0.8"/>
  <circle cx="235" cy="140" r="10" fill="#ffffff" opacity="0.55"/>
  <circle cx="150" cy="150" r="8" fill="#A44A3F" opacity="0.45"/>

  <!-- sombra del plato -->
