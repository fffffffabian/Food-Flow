  <!-- vapor -->
  <g stroke="#A44A3F" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M430 72c-14 18-14 36 0 54"/>
    <path d="M480 60c-14 18-14 36 0 54"/>
    <path d="M530 72c-14 18-14 36 0 54"/>
  </g>

  <!-- palillos -->
  <rect x="612" y="66" width="13" height="158" rx="6.5" fill="#FAF3EA" transform="rotate(18 618 145)"/>
  <rect x="642" y="66" width="13" height="158" rx="6.5" fill="#FAF3EA" transform="rotate(10 648 145)"/>

  <!-- tazon -->
  <path d="M320 152h320a160 160 0 0 1-320 0z" fill="#A44A3F"/>
  <rect x="305" y="139" width="350" height="27" rx="13.5" fill="#FAF3EA"/>

  <!-- comida (domo) -->
  <path d="M356 152a124 44 0 0 1 248 0z" fill="#FAF3EA" opacity="0.92"/>
  <circle cx="452" cy="140" r="15" fill="#E4B363"/>
  <circle cx="500" cy="132" r="13" fill="#A44A3F"/>
  <circle cx="545" cy="142" r="11" fill="#E4B363"/>
</svg>
