<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Flow — Tu carrito</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Google Fonts: Poppins (headings) + Open Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ff-primary: #A44A3F;
      --ff-accent:  #E4B363;
      --ff-bg:      #FAF3EA;
      --ff-ink:     #3a2b26;
    }
    body {
      background: var(--ff-bg);
      color: var(--ff-ink);
      font-family: "Open Sans", system-ui, sans-serif;
    }
    h1, h2, h3, h4, h5, .navbar-brand { font-family: "Poppins", system-ui, sans-serif; }
    .ff-navbar { background: var(--ff-primary); }
    .ff-navbar .navbar-brand { color: #fff; font-weight: 700; letter-spacing: .3px; }
    .ff-navbar .ff-back { color: #fff; text-decoration: none; font-weight: 600; }
    .ff-navbar .ff-back:hover { text-decoration: underline; }

    h1.ff-title { color: var(--ff-primary); font-weight: 700; }
    .ff-card { border: none; border-radius: 16px; box-shadow: 0 6px 18px rgba(110, 70, 55, .10); }
    .ff-btn { background: var(--ff-accent); color: var(--ff-ink); font-weight: 600; border: none; }
    .ff-btn:hover { background: #d8a24f; color: var(--ff-ink); }
    .ff-total { color: var(--ff-primary); }
    footer { color: #8a756c; }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <nav class="navbar ff-navbar shadow-sm">
    <div class="container">
      <a class="ff-back" href="index.html"><i class="bi bi-arrow-left"></i> Volver al menú</a>
      <span class="navbar-brand mb-0 h1"><img src="assets/img/logo.svg" alt="" style="height:26px;vertical-align:-5px" class="me-1">Food Flow</span>
    </div>
  </nav>

  <main class="container py-4" style="max-width:720px">
    <h1 class="ff-title mb-4">Tu carrito</h1>

    <div class="card ff-card">
      <div class="card-body">
        <div id="ff-cart-body"></div>
        <div id="ff-cart-foot" class="pt-2"></div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4">
    <small>Food Flow · pedidos a domicilio para PyMEs</small>
  </footer>

  <!-- Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica del carrito -->
  <script src="cart.js"></script>
</body>
</html>
